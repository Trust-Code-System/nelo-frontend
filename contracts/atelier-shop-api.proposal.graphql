# Nelo Atelier — proposed Shop API extensions
#
# STATUS: PROPOSAL. Nothing here exists yet. This is the frontend's side of the contract,
# written so the backend team has something concrete to accept, amend or reject rather than
# a blank page. Names, nullability and result unions are all open to change.
#
# Written against `frontend-architecture-context.md` (2026-09-15), which states:
#   - Atelier entities and transaction modules exist; customer-facing resolvers do not.
#   - The measurement intake contract must be agreed before submission is implemented.
#   - Customers must not receive staff production controls, range overrides, retention
#     holds or global-erasure operations.
#
# Two decisions we need from the backend before we can generate types:
#   1. The scalar for decimal millimetres (see `DecimalMillimetres` below).
#   2. Whether appointment availability is queryable at all, or request-only.

# ---------------------------------------------------------------------------
# Scalars
# ---------------------------------------------------------------------------

"""
Decimal millimetres to two places, as a STRING — e.g. "863.60".

Deliberately not Int and not Float:
  - Int cannot hold 6.35 mm (a quarter inch) without destroying approved precision.
  - Float invites binary rounding drift on a value that is a stored decimal.

If the backend prefers a custom scalar, we will map it in codegen to `string` and keep
string-in / string-out. What we must NOT do is infer the representation from JSONB storage
or invent codegen scalar behaviour.
"""
scalar DecimalMillimetres

"Offset-bearing ISO-8601. Never a date-only local time."
scalar DateTime

# ---------------------------------------------------------------------------
# Measurements
# ---------------------------------------------------------------------------

enum MeasurementCode {
  bust
  waist
  hip
  height
  shoulderWidth
  sleeveLength
  inseam
}

enum MeasurementUnit {
  inch
  centimetre
}

type Measurement {
  code: MeasurementCode!
  "null means NOT CONFIRMED. It does not mean zero."
  millimetres: DecimalMillimetres
}

"""
A reusable measurement profile. One profile per customer is the active default.

Editing or creating a profile must NOT retroactively change a commission already in
production — a project holds an independently confirmed snapshot (see BespokeProject).
"""
type MeasurementProfile {
  id: ID!
  name: String!
  isDefault: Boolean!
  measurements: [Measurement!]!
  confirmedAt: DateTime
  "Customer-safe only. Never the staff actor id or an override reason."
  confirmedLocation: String
  updatedAt: DateTime!
}

input MeasurementEntryInput {
  code: MeasurementCode!
  """
  The decimal exactly as the customer typed it — "23.25". Sent as a string with an explicit
  unit so backend normalisation stays authoritative. Omit the entry entirely for a value
  that is not confirmed; do not send "0".
  """
  value: String!
  unit: MeasurementUnit!
}

input UpsertMeasurementProfileInput {
  "Omit to create."
  id: ID
  name: String!
  makeDefault: Boolean
  entries: [MeasurementEntryInput!]!
}

type MeasurementRangeError {
  errorCode: String!
  message: String!
  code: MeasurementCode!
  "Present so the UI can explain, never so it can clamp the value itself."
  plausibleMinMillimetres: DecimalMillimetres!
  plausibleMaxMillimetres: DecimalMillimetres!
}

type MeasurementFormatError {
  errorCode: String!
  message: String!
  code: MeasurementCode!
}

union UpsertMeasurementProfileResult =
    MeasurementProfile
  | MeasurementRangeError
  | MeasurementFormatError

# ---------------------------------------------------------------------------
# Appointments
# ---------------------------------------------------------------------------

enum AppointmentPurpose {
  consultation
  fitting
}

"Independent of purpose — a fitting can be bridal, a consultation can be ready-to-wear."
enum CommissionContext {
  readyToWear
  bespoke
  bridal
}

enum AppointmentLocationMode {
  inStore
  customerLocation
  virtual
}

enum AppointmentStatus {
  requested
  confirmed
  rescheduled
  cancelled
  completed
}

type AtelierAppointment {
  id: ID!
  purpose: AppointmentPurpose!
  context: CommissionContext!
  locationMode: AppointmentLocationMode!
  "Present for inStore. Free text, resolved by the atelier."
  location: String
  "Offset-bearing. Display in Africa/Lagos unless the customer is elsewhere."
  scheduledAt: DateTime
  status: AppointmentStatus!
  "Server decision. Null when no fee applies."
  feeMinorUnits: Int
  feeCurrencyCode: String
  "Server decision — never inferred from the date on the client."
  isCancellable: Boolean!
  project: BespokeProject
}

input RequestAppointmentInput {
  purpose: AppointmentPurpose!
  context: CommissionContext!
  locationMode: AppointmentLocationMode!
  "Customer's preferred window. Requesting is not reserving."
  preferredAt: DateTime!
  alternateAt: DateTime
  notes: String
  "Optional at request time. Measurements may also be taken at the appointment itself."
  measurements: [MeasurementEntryInput!]
  projectId: ID
}

type AppointmentUnavailableError {
  errorCode: String!
  message: String!
  suggestedAt: [DateTime!]!
}

union RequestAppointmentResult = AtelierAppointment | AppointmentUnavailableError

# ---------------------------------------------------------------------------
# Commissions
# ---------------------------------------------------------------------------

enum BespokeProjectStage {
  consultation
  proposal
  confirmed
  active
  ready
  completed
  cancelled
}

"More granular than the project stage. Per garment."
enum BespokeItemStage {
  design
  materials
  cutting
  sewing
  fitting
  qualityControl
  ready
  delivered
}

type BespokeItem {
  id: ID!
  name: String!
  stage: BespokeItemStage!
  """
  The measurement snapshot this garment is actually being cut to — independently confirmed,
  and NOT a live view of the customer's profile.
  """
  confirmedMeasurements: [Measurement!]!
  confirmedAt: DateTime
  estimatedReadyAt: DateTime
}

type BespokeProject {
  id: ID!
  reference: String!
  context: CommissionContext!
  stage: BespokeProjectStage!
  items: [BespokeItem!]!
  appointments: [AtelierAppointment!]!
  """
  Commercial charges belong to Vendure Orders. An item can link to several Order Lines and
  one line can fund several items, so this is a list and the frontend must not assume one
  project equals one Order, nor compute deposit/balance arithmetic itself.
  """
  relatedOrderCodes: [String!]!
  """
  Published by the backend. The frontend renders it; it never derives it.
  Null until the proposal is accepted.
  """
  chargeSchedule: [ChargeScheduleEntry!]
  "Only the actions this customer is permitted to take right now."
  permittedActions: [BespokeProjectAction!]!
  createdAt: DateTime!
}

type ChargeScheduleEntry {
  label: String!
  amountMinorUnits: Int!
  currencyCode: String!
  dueAt: DateTime
  isSettled: Boolean!
  orderCode: String
}

enum BespokeProjectAction {
  acceptProposal
  declineProposal
  requestAppointment
  cancelAppointment
  messageAtelier
}

input RequestCommissionInput {
  context: CommissionContext!
  occasion: String
  neededBy: DateTime
  notes: String
  measurements: [MeasurementEntryInput!]
  preferredAppointment: RequestAppointmentInput
}

# ---------------------------------------------------------------------------
# Operations
# ---------------------------------------------------------------------------

extend type Query {
  "Null for a guest. Never returns another customer's profile."
  activeMeasurementProfiles: [MeasurementProfile!]!

  "Ownership-checked. Null when the id is not this customer's."
  bespokeProject(id: ID!): BespokeProject

  bespokeProjects: [BespokeProject!]!

  atelierAppointments(status: [AppointmentStatus!]): [AtelierAppointment!]!

  """
  OPEN QUESTION for the backend: is availability queryable, or is booking request-only?
  We have designed the UI for request-only, which is safer — it never implies a slot is
  held. If this query does not exist, we will simply not add it.
  """
  atelierAvailability(
    purpose: AppointmentPurpose!
    locationMode: AppointmentLocationMode!
    from: DateTime!
    to: DateTime!
  ): [DateTime!]!
}

extend type Mutation {
  upsertMeasurementProfile(
    input: UpsertMeasurementProfileInput!
  ): UpsertMeasurementProfileResult!

  deleteMeasurementProfile(id: ID!): Boolean!

  requestAppointment(input: RequestAppointmentInput!): RequestAppointmentResult!

  cancelAppointment(id: ID!): AtelierAppointment!

  requestCommission(input: RequestCommissionInput!): BespokeProject!

  "Customer-side only. Stage transitions remain staff-only and are not exposed here."
  respondToProposal(projectId: ID!, accept: Boolean!): BespokeProject!
}

# ---------------------------------------------------------------------------
# Deliberately NOT proposed
# ---------------------------------------------------------------------------
#
# - Any mutation that sets BespokeItemStage or BespokeProjectStage directly. Those are staff
#   production controls; the current module permissions are internal interfaces, not a
#   customer authorization contract.
# - Range-override, retention-hold or global-erasure operations.
# - Anything returning a staff actor id or an override reason.
# - A "pay deposit" mutation. Commercial charges go through the ordinary Vendure Order and
#   the Paystack initialisation operation, once that contract exists.
