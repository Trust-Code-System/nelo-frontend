name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells you nothing useful, so cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Routing identifiers, not secrets. Real Channel tokens are not needed to typecheck,
  # lint, build or run fixture-backed journeys — and must not be put in a workflow file.
  VENDURE_SHOP_API_URL: http://localhost:3000/shop-api
  VENDURE_CHANNEL_TOKEN_NG: ci-ng
  VENDURE_CHANNEL_TOKEN_INTERNATIONAL: ci-international

jobs:
  verify:
    name: Typecheck · lint · unit · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` fails if package.json and the lockfile disagree, which is the point.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Codegen drift
        run: npm run codegen:check

  e2e:
    name: Critical journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs against the production build, not the dev server — see playwright.config.ts.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run journeys
        run: npm run e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
          if-no-files-found: ignore
